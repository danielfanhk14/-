<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動小廚房</title>
    <style>
        /* --- 承襲 index.html 的視覺規範 --- */
        :root {
            --bg-base: #F2EFE9;
            --panel-bg: #FFFFFF;
            --text-dark: #3A3530;
            --text-light: #7A7267;
            --accent-terra: #B25D4A;
            --accent-wheat: #D4B886;
            --accent-sage: #899C8E;
            --border-color: #D8D1C7;
        }

        /* 修正 body 排版：確保導覽列置頂且不跳動 */
        body {
            font-family: 'Noto Serif TC', 'Georgia', serif;
            background-color: var(--bg-base);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: block; /* 移除 flex，改回區塊排版 */
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- 全域導覽列樣式 (與首頁完全同步) --- */
        .global-nav {
            position: sticky;
            top: 0;
            width: 100%;
            background-color: rgba(242, 239, 233, 0.95);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 15px 0;
            z-index: 1000;
            font-family: 'Helvetica Neue', sans-serif;
            box-sizing: border-box;
        }

        .nav-item {
            text-decoration: none;
            color: var(--text-light);
            font-size: 0.9rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-item:hover, .nav-item.active { color: var(--accent-terra); }

        .nav-item::after {
            content: '';
            position: absolute;
            width: 0; height: 1px;
            bottom: -5px; left: 0;
            background-color: var(--accent-terra);
            transition: width 0.3s ease;
        }
        .nav-item.active::after { width: 100%; }

        /* --- 內容容器：修正內容置中問題 --- */
        .page-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 0 20px 60px 20px;
            box-sizing: border-box;
        }

        h1 {
            font-weight: normal;
            letter-spacing: 4px;
            margin-bottom: 10px;
            color: var(--text-dark);
            border-bottom: 1px solid var(--text-dark);
            padding-bottom: 10px;
            margin-top: 60px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--text-light);
            margin-bottom: 40px;
            letter-spacing: 1px;
            font-family: 'Helvetica Neue', sans-serif;
        }

        /* --- 確保 game-board 本身也不限制高度 --- */
        .game-board {
            display: flex;
            justify-content: center;
            align-items: flex-start; /* 改為 flex-start 讓面板對齊頂部 */
            width: 100%;
            max-width: 1200px;
            gap: 30px;
        }

        /* --- 修改桌面版側邊欄樣式 --- */
        .side-panel {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            /* --- 關鍵修改：移除高度限制與捲軸 --- */
            max-height: none; 
            overflow-y: visible; 
        }

        .side-panel h2 {
            text-align: center;
            font-size: 1.1rem;
            font-weight: normal;
            letter-spacing: 2px;
            margin-top: 0;
            padding-bottom: 15px;
            color: var(--text-dark);
            border-bottom: 1px solid var(--border-color);
            /* --- 關鍵修改：移除 sticky，讓標題隨頁面捲動 --- */
            position: static; 
            background: var(--panel-bg);
            z-index: 10;
        }

        .grid-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .item-card {
            border: 1px solid var(--border-color);
            border-radius: 2px;
            padding: 15px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            background-color: #fcfcfc;
        }

        .item-card:hover { border-color: var(--accent-wheat); background-color: #fff; }
        .item-icon { font-size: 2.2rem; margin-bottom: 10px; filter: grayscale(0.2); }
        .item-name { font-size: 0.85rem; letter-spacing: 1px; color: var(--text-dark); }
        .item-card.selected { background-color: var(--bg-base); border-color: var(--accent-sage); opacity: 0.7; }

        /* --- 中間烹飪區 --- */
        .center-panel {
            flex: 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #E8E4DC;
            border-radius: 4px;
            padding: 30px;
            border: 1px solid var(--border-color);
        }

        .pot-slots { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; }
        .slot {
            width: 150px; height: 150px;
            border: 1px dashed var(--text-light);
            border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-color: rgba(255,255,255,0.5);
            cursor: pointer; transition: all 0.3s;
        }
        .slot.filled { border: 1px solid var(--accent-sage); background-color: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .slot-hint { font-size: 0.7rem; color: var(--text-light); margin-top: 5px; }

        .main-pot { font-size: 7rem; margin-bottom: 30px; filter: sepia(0.2); }
        .cook-btn {
            background-color: transparent; border: 1px solid var(--text-dark);
            color: var(--text-dark); padding: 15px 50px; font-size: 1rem;
            letter-spacing: 4px; cursor: pointer; font-family: 'Noto Serif TC', serif;
            transition: all 0.4s ease; opacity: 0.3; pointer-events: none;
        }
        .cook-btn.ready { opacity: 1; pointer-events: auto; background-color: var(--text-dark); color: var(--bg-base); }
        
        /* --- 結果視窗 --- */
        .modal-overlay {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center;
            z-index: 1100; backdrop-filter: blur(8px);
        }

        .modal-content {
            background-color: #2a2a2a; padding: 50px 40px; border-radius: 20px;
            text-align: center; max-width: 500px; width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #ffffff; border: 1px solid rgba(255,255,255,0.2);
        }

        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .result-icon { font-size: 2rem; margin-bottom: 10px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .result-title { color: #f9d877; font-size: 1.6rem; margin-bottom: 15px; text-shadow: 1px 1px 5px rgba(0,0,0,0.8); }
        .result-desc { line-height: 1.6; color: #f0f0f0; margin-bottom: 30px; text-align: justify; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); }
        .close-btn { background: #899C8E; color: #fff; border: none; padding: 12px 30px; border-radius: 30px; cursor: pointer; font-size: 1.1rem; font-weight: bold; }

        .badge-btn {
            margin-top: 40px; background: transparent; border: 1px solid var(--text-dark);
            color: var(--text-dark); padding: 15px 40px; font-size: 1rem;
            letter-spacing: 3px; cursor: pointer; transition: all 0.4s ease;
        }
        .badge-btn:hover { background: var(--text-dark); color: var(--bg-base); }
        
        /* 炒鍋效果 */
        @keyframes intense-fry { 
  0% { 
    transform: translateY(0) scale(1) rotate(0deg); 
  } 
  50% {
    /* 跳到最高點時稍微向前傾斜 */
    transform: translateY(-8px) scale(1.05) rotate(-3deg);
  }
  100% { 
    transform: translateY(0) scale(1) rotate(0deg); 
  } 
}

/* 由於在 keyframes 裡完整定義了來回，可以移除 alternate */
.is-cooking { 
  animation: intense-fry 0.3s infinite ease-in-out; 
}



        @media (max-width: 900px) {
            /* 調整容器為垂直排列 */
            .game-board { 
                flex-direction: column; 
                align-items: center; 
                gap: 20px;
            }

            /* 確保面板寬度撐滿 */
            .side-panel, .center-panel { 
                width: 100%; 
                max-height: none; 
            }

            /* --- 重新定義手機版順序 --- */
            
            /* 1. 選取麵體 (原本在左，設為 order 1) */
            .side-panel:first-child { 
                order: 1; 
            }

            /* 2. 慢熬醬料 (原本在右，設為 order 2) */
            .side-panel:last-child { 
                order: 2; 
            }

            /* 3. 烹飪區 (原本在中間，設為 order 3) */
            .center-panel { 
                order: 3; 
                padding: 40px 20px;
            }

            /* 優化：手機版網格改為三欄讓頁面不要太長 (選填) */
            .grid-list {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .item-icon { font-size: 1.8rem; }
            .item-name { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

<nav class="global-nav">

<div class="page-content">

    <div class="game-board">
        <div class="side-panel">
            <h2>🍝 選取麵體</h2>
            <div class="grid-list" id="pasta-list"></div>
        </div>

        <div class="center-panel">
            <div class="pot-slots">
                <div class="slot" id="slot-pasta" onclick="removePasta()"><span class="slot-hint">期待揉製</span></div>
                <div style="color: var(--text-light); font-size: 1.5rem;">+</div>
                <div class="slot" id="slot-sauce" onclick="removeSauce()"><span class="slot-hint">待選醬汁</span></div>
            </div>
            <div class="main-pot" id="main-pot"><img src="img/Pasta.png" style="width: 120px; height: 120px; opacity: 0.8;" alt="鍋子"></div>
            <button class="cook-btn" id="cook-btn" onclick="startCooking()">等待食材放入...</button>
            <div id="cooking-status" style="margin-top: 20px; font-size: 0.9rem; color: var(--accent-terra); height: 20px; letter-spacing: 2px;"></div>
        </div>

        <div class="side-panel">
            <h2>🥫 慢熬醬料</h2>
            <div class="grid-list" id="sauce-list"></div>
        </div>
    </div>

    <button class="badge-btn" onclick="window.location.href='index.html'">重回旅程</button>
</div>

<div class="modal-overlay" id="result-modal">
    <div class="modal-content" id="result-modal-content">
        <div class="result-icon">上桌了</div>
        <h2 class="result-title" id="result-title">名稱</h2>
        <div class="result-desc" id="result-desc">說明</div>
        <button class="close-btn" onclick="closeModal()">再做一盤</button>
    </div>
</div>

    let currentPasta = null;
    let currentSauce = null;

    function init() {
        const pastaList = document.getElementById('pasta-list');
        const sauceList = document.getElementById('sauce-list');
        for (const [id, data] of Object.entries(pastas)) {
            pastaList.innerHTML += `<div class="item-card" id="card-pasta-${id}" onclick="addPasta('${id}')"><div class="item-icon">${data.icon}</div><div class="item-name">${data.zh}</div></div>`;
        }
        for (const [id, data] of Object.entries(sauces)) {
            sauceList.innerHTML += `<div class="item-card" id="card-sauce-${id}" onclick="addSauce('${id}')"><div class="item-icon">${data.icon}</div><div class="item-name">${data.zh}</div></div>`;
        }
    }

    function addPasta(id) { currentPasta = id; updateUI(); }
    function addSauce(id) { currentSauce = id; updateUI(); }
    function removePasta() { currentPasta = null; currentSauce = null; updateUI(); }
    function removeSauce() { currentSauce = null; updateUI(); }

       function updateUI() {
        const slotPasta = document.getElementById('slot-pasta');
        slotPasta.innerHTML = currentPasta ? `<div>${pastas[currentPasta].icon}</div><div class="slot-hint">點擊移除</div>` : `<span class="slot-hint">選麵體<br>空</span>`;
        currentPasta ? slotPasta.classList.add('filled') : slotPasta.classList.remove('filled');

        const slotSauce = document.getElementById('slot-sauce');
        slotSauce.innerHTML = currentSauce ? `<div>${sauces[currentSauce].icon}</div><div class="slot-hint">點擊移除</div>` : `<span class="slot-hint">選醬料br<>空</span>`;
        currentSauce ? slotSauce.classList.add('filled') : slotSauce.classList.remove('filled');

        // --- 修改後的麵體清單邏輯 ---
        document.querySelectorAll("[id^='card-pasta-']").forEach(el => {
            const id = el.id.replace('card-pasta-', '');
            el.classList.toggle('selected', id === currentPasta);
            
            if (currentPasta) {
                // 如果已經選了麵體，只顯示被選中的那一個
                el.style.display = (id === currentPasta) ? 'block' : 'none';
            } else {
                // 如果還沒選麵體，根據醬汁過濾（或全部顯示）
                el.style.display = (!currentSauce || (combinations[id] && combinations[id][currentSauce])) ? 'block' : 'none';
            }
        });

        document.querySelectorAll("[id^='card-sauce-']").forEach(el => {
            const id = el.id.replace('card-sauce-', '');
            el.classList.toggle('selected', id === currentSauce);
            el.style.display = (!currentPasta || (combinations[currentPasta] && combinations[currentPasta][id])) ? 'block' : 'none';
        });

        const cookBtn = document.getElementById('cook-btn');
        if (currentPasta && currentSauce) {
            cookBtn.classList.add('ready');
            cookBtn.innerText = "🔥 開始拌炒！";
        } else {
            cookBtn.classList.remove('ready');
            cookBtn.innerText = "等待食材放入...";
        }
    }

    function startCooking() {
        const pot = document.getElementById('main-pot');
        const status = document.getElementById('cooking-status');
        const cookBtn = document.getElementById('cook-btn');
        cookBtn.classList.remove('ready');
        cookBtn.innerText = "烹煮中...";
        pot.classList.add('is-cooking');
        status.innerText = "主廚正在用猛火翻炒中...";
        setTimeout(() => {
            pot.classList.remove('is-cooking');
            status.innerText = "";
            showResult();
        }, 2000);
    }

    function showResult() {
        const resultData = combinations[currentPasta][currentSauce];
        document.getElementById('result-title').innerText = resultData.name;
        document.getElementById('result-desc').innerText = resultData.desc;
        const modalContent = document.getElementById('result-modal-content');
        modalContent.style.background = `linear-gradient(to bottom, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.5)), url('${resultData.img}') center/cover`;
        document.getElementById('result-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('result-modal').style.display = 'none';
        removePasta();
    }

    window.onload = init;
</script>
</body>
</html>
